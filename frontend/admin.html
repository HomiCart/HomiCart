<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>HomiCart — لوحة التحكم v2</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800&family=Cairo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:#060b12; color:#fff; direction:rtl; font-family:'Cairo',sans-serif; }

/* ── Layout ── */
.admin-wrap { display:flex; min-height:100vh; }

/* ── Sidebar ── */
.sidebar {
  width: 220px; min-height:100vh;
  background: rgba(255,255,255,.03);
  border-left: 1px solid rgba(255,255,255,.07);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  flex-shrink:0;
}
.sidebar-logo {
  padding:1.4rem 1.2rem; border-bottom:1px solid rgba(255,255,255,.07);
  display:flex; align-items:center; gap:.6rem;
}
.sidebar-logo span {
  font-family:'Alexandria',sans-serif; font-size:1.1rem; font-weight:800;
  background:linear-gradient(135deg,#18bfef,#0d9bcb); -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.sidebar-logo i { color:#18bfef; font-size:1.2rem; }
.sidebar-nav { flex:1; padding:.8rem 0; }
.nav-section-label {
  font-size:.68rem; font-weight:700; letter-spacing:.1em;
  color:rgba(255,255,255,.3); padding:.6rem 1.2rem .3rem; text-transform:uppercase;
}
.nav-item {
  display:flex; align-items:center; gap:.65rem;
  padding:.7rem 1.2rem; cursor:pointer; font-size:.88rem;
  color:rgba(255,255,255,.55); transition:all .2s; border-right:3px solid transparent;
  user-select:none;
}
.nav-item:hover { color:#fff; background:rgba(255,255,255,.04); }
.nav-item.active { color:#18bfef; background:rgba(24,191,239,.08); border-right-color:#18bfef; }
.nav-item i { width:16px; text-align:center; }
.store-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

/* ── Main ── */
.main { flex:1; overflow-x:hidden; }

/* ── Top bar ── */
.topbar {
  padding:1rem 2rem; border-bottom:1px solid rgba(255,255,255,.07);
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(255,255,255,.02);
}
.topbar-title { font-family:'Alexandria',sans-serif; font-size:1.1rem; font-weight:700; }
.topbar-right { display:flex; gap:.8rem; align-items:center; }
.btn-refresh {
  background:rgba(24,191,239,.1); border:1px solid rgba(24,191,239,.25);
  color:#18bfef; padding:.45rem 1rem; border-radius:8px; cursor:pointer;
  font-family:'Cairo',sans-serif; font-size:.82rem; font-weight:600;
  display:flex; align-items:center; gap:.4rem; transition:all .2s;
}
.btn-refresh:hover { background:rgba(24,191,239,.18); }
.last-refresh { font-size:.75rem; color:rgba(255,255,255,.3); }

/* ── Page sections ── */
.page { display:none; padding:1.8rem 2rem; }
.page.active { display:block; }

/* ── Stats grid ── */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; margin-bottom:2rem; }
.stat-card {
  background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
  border-radius:14px; padding:1.2rem 1.4rem;
  display:flex; flex-direction:column; gap:.4rem;
}
.stat-icon { font-size:1.4rem; width:38px; height:38px; border-radius:10px;
  display:flex; align-items:center; justify-content:center; }
.stat-value { font-family:'Alexandria',sans-serif; font-size:1.9rem; font-weight:800; }
.stat-label { font-size:.78rem; color:rgba(255,255,255,.4); }
.stat-card.teal  .stat-icon { background:rgba(24,191,239,.12); color:#18bfef; }
.stat-card.amber .stat-icon { background:rgba(255,165,0,.12);  color:#ffa500; }
.stat-card.green .stat-icon { background:rgba(40,200,100,.12); color:#28c864; }
.stat-card.purple.stat-icon { background:rgba(150,80,255,.12); color:#9650ff; }

/* ── Section headers ── */
.section-head {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:1rem;
}
.section-title {
  font-family:'Alexandria',sans-serif; font-size:1rem; font-weight:700;
  display:flex; align-items:center; gap:.5rem;
}
.section-title i { color:#18bfef; }

/* ── Order Window Panel ── */
.window-panel {
  background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
  border-radius:14px; padding:1.4rem; margin-bottom:1.5rem;
}
.window-row { display:flex; gap:1rem; flex-wrap:wrap; align-items:flex-end; }
.window-field { display:flex; flex-direction:column; gap:.4rem; flex:1; min-width:200px; }
.window-field label { font-size:.8rem; color:rgba(255,255,255,.55); font-weight:600; }
.window-field input[type="datetime-local"] {
  background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.12);
  border-radius:9px; padding:.6rem .9rem; color:#fff; font-size:.9rem;
  outline:none; transition:border-color .2s; font-family:'Cairo',sans-serif;
}
.window-field input:focus { border-color:#18bfef; }
.window-status {
  display:flex; align-items:center; gap:.5rem; font-size:.82rem;
  padding:.5rem .9rem; border-radius:8px; font-weight:600;
}
.window-status.open   { background:rgba(40,200,100,.1);  color:#28c864; }
.window-status.closed { background:rgba(255,80,80,.1);   color:#ff6060; }
.window-status.before { background:rgba(255,165,0,.1);   color:#ffa500; }

/* ── Buttons ── */
.btn { display:inline-flex; align-items:center; gap:.45rem; padding:.6rem 1.2rem;
  border-radius:9px; cursor:pointer; font-family:'Cairo',sans-serif;
  font-size:.85rem; font-weight:600; border:none; transition:all .2s; }
.btn-primary { background:linear-gradient(135deg,#18bfef,#0d9bcb); color:#fff; box-shadow:0 3px 14px rgba(24,191,239,.25); }
.btn-primary:hover { filter:brightness(1.1); }
.btn-amber   { background:linear-gradient(135deg,#f5a623,#e08c00); color:#fff; box-shadow:0 3px 14px rgba(245,166,35,.25); }
.btn-amber:hover { filter:brightness(1.1); }
.btn-green   { background:linear-gradient(135deg,#28c864,#1a9d4a); color:#fff; box-shadow:0 3px 14px rgba(40,200,100,.25); }
.btn-green:hover { filter:brightness(1.1); }
.btn-outline { background:transparent; border:1.5px solid rgba(255,255,255,.2); color:rgba(255,255,255,.7); }
.btn-outline:hover { border-color:#18bfef; color:#18bfef; }
.btn:disabled { opacity:.5; cursor:not-allowed; }

/* ── Orders table ── */
.table-wrap { overflow-x:auto; border-radius:14px; border:1px solid rgba(255,255,255,.08); }
table { width:100%; border-collapse:collapse; font-size:.84rem; }
thead th {
  background:rgba(255,255,255,.05); padding:.75rem 1rem; text-align:right;
  font-family:'Alexandria',sans-serif; font-size:.78rem; font-weight:700;
  color:rgba(255,255,255,.55); white-space:nowrap; border-bottom:1px solid rgba(255,255,255,.08);
}
tbody tr { border-bottom:1px solid rgba(255,255,255,.05); transition:background .15s; }
tbody tr:hover { background:rgba(255,255,255,.03); }
tbody td { padding:.7rem 1rem; vertical-align:middle; }
.td-id { font-family:monospace; font-size:.78rem; color:#18bfef; }
.td-items { max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:rgba(255,255,255,.75); }
.td-date { font-size:.76rem; color:rgba(255,255,255,.4); white-space:nowrap; }

/* Status badges */
.badge {
  display:inline-flex; align-items:center; gap:.3rem;
  padding:.22rem .7rem; border-radius:50px; font-size:.73rem; font-weight:700;
}
.badge-New        { background:rgba(24,191,239,.15); color:#18bfef; }
.badge-Preparing  { background:rgba(255,165,0,.15);  color:#ffa500; }
.badge-Delivered  { background:rgba(40,200,100,.15); color:#28c864; }
.badge-Cancelled  { background:rgba(255,80,80,.15);  color:#ff6060; }

/* Status select in table */
.status-select {
  background:transparent; border:1px solid rgba(255,255,255,.15);
  border-radius:6px; color:#fff; padding:.2rem .5rem; font-size:.78rem;
  cursor:pointer; outline:none;
}
.status-select option { background:#0d1a28; }

/* ── Bulk actions bar ── */
.bulk-bar {
  display:flex; gap:.8rem; flex-wrap:wrap; align-items:center;
  padding:1rem 1.4rem; background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08); border-radius:12px; margin-bottom:1rem;
}
.bulk-bar span { font-size:.82rem; color:rgba(255,255,255,.5); }

/* ── Store bar chart ── */
.store-bars { display:flex; flex-direction:column; gap:.8rem; margin-top:1rem; }
.store-bar-row { display:flex; align-items:center; gap:.8rem; }
.store-bar-label { width:130px; font-size:.82rem; color:rgba(255,255,255,.65); flex-shrink:0; text-align:left; }
.store-bar-track { flex:1; height:8px; background:rgba(255,255,255,.07); border-radius:50px; overflow:hidden; }
.store-bar-fill  { height:100%; border-radius:50px; transition:width .8s ease; }
.store-bar-count { width:35px; text-align:right; font-size:.82rem; color:rgba(255,255,255,.5); }

/* ── Toast ── */
.toast-wrap { position:fixed; top:1.2rem; left:1.2rem; z-index:9999; display:flex; flex-direction:column; gap:.5rem; }
.toast {
  background:rgba(20,30,45,.97); border:1px solid rgba(255,255,255,.1);
  border-radius:10px; padding:.7rem 1.1rem; font-size:.84rem;
  display:flex; align-items:center; gap:.55rem;
  animation:toastIn .3s ease; min-width:220px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.toast.success { border-color:rgba(40,200,100,.3); color:#28c864; }
.toast.error   { border-color:rgba(255,80,80,.3);  color:#ff6060; }
.toast.info    { border-color:rgba(24,191,239,.3);  color:#18bfef; }
@keyframes toastIn { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }

/* ── Loading overlay ── */
.loading-overlay {
  position:fixed; inset:0; background:rgba(6,11,18,.85);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:9998; gap:1rem; backdrop-filter:blur(4px);
}
.loading-overlay .spin { font-size:2.5rem; color:#18bfef; animation:spin 1s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.loading-overlay p { color:rgba(255,255,255,.6); font-size:.9rem; }

/* ── Empty state ── */
.empty-state { text-align:center; padding:3rem 1rem; color:rgba(255,255,255,.3); }
.empty-state i { font-size:2.5rem; margin-bottom:.8rem; display:block; }

/* ── Responsive ── */
@media(max-width:700px) {
  .sidebar { width:60px; }
  .sidebar-logo span, .nav-item span, .nav-section-label { display:none; }
  .page { padding:1rem; }
  .topbar { padding:.8rem 1rem; }
}
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay" style="display:none"></div>

<div class="toast-wrap" id="toastWrap"></div>

<div class="admin-wrap">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-shopping-bag"></i>
      <span>HomiCart</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">عام</div>
      <div class="nav-item active" onclick="switchPage('overview')">
        <i class="fas fa-chart-pie"></i><span>نظرة عامة</span>
      </div>

      <div class="nav-section-label" style="margin-top:.5rem">المتاجر</div>
      <div class="nav-item" onclick="switchPage('store-AlRoknAlMasry')">
        <span class="store-dot" style="background:#ef4444"></span>
        <span>الركن المصري</span>
      </div>
      <div class="nav-item" onclick="switchPage('store-AlFayoumi')">
        <span class="store-dot" style="background:#f59e0b"></span>
        <span>الفيومي</span>
      </div>
    </nav>
  </aside>

  <!-- ══ MAIN ══ -->
  <div class="main">

    <!-- Top bar -->
    <div class="topbar">
      <div class="topbar-title" id="topbarTitle">📊 نظرة عامة</div>
      <div class="topbar-right">
        <span class="last-refresh" id="lastRefresh"></span>
        <button class="btn-refresh" onclick="refreshAll()">
          <i class="fas fa-sync-alt"></i> تحديث
        </button>
      </div>
    </div>

    <!-- ══ OVERVIEW PAGE ══ -->
    <div id="page-overview" class="page active">

      <div class="stats-grid" id="statsGrid">
        <div class="stat-card teal">
          <div class="stat-icon"><i class="fas fa-receipt"></i></div>
          <div class="stat-value" id="st-total">—</div>
          <div class="stat-label">إجمالي الطلبات</div>
        </div>
        <div class="stat-card" style="border-color:rgba(24,191,239,.2)">
          <div class="stat-icon" style="background:rgba(24,191,239,.12);color:#18bfef"><i class="fas fa-star"></i></div>
          <div class="stat-value" id="st-new">—</div>
          <div class="stat-label">طلبات جديدة</div>
        </div>
        <div class="stat-card amber">
          <div class="stat-icon"><i class="fas fa-fire"></i></div>
          <div class="stat-value" id="st-preparing">—</div>
          <div class="stat-label">جاري التحضير</div>
        </div>
        <div class="stat-card green">
          <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
          <div class="stat-value" id="st-delivered">—</div>
          <div class="stat-label">تم التوصيل</div>
        </div>
        <div class="stat-card" style="border-color:rgba(255,80,80,.2)">
          <div class="stat-icon" style="background:rgba(255,80,80,.1);color:#ff6060"><i class="fas fa-times-circle"></i></div>
          <div class="stat-value" id="st-cancelled">—</div>
          <div class="stat-label">ملغية</div>
        </div>
      </div>

      <div class="section-head">
        <div class="section-title"><i class="fas fa-store"></i> الطلبات حسب المتجر</div>
      </div>
      <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:1.4rem">
        <div class="store-bars" id="storeBars">
          <div class="empty-state" style="color:rgba(255,255,255,.35)">اضغط <b style="color:#18bfef">تحديث</b> لتحميل البيانات</div>
        </div>
      </div>
    </div>

    <!-- ══ STORE PAGES (generated dynamically) ══ -->
    <div id="page-store-AlRoknAlMasry" class="page"></div>
    <div id="page-store-AlFayoumi"     class="page"></div>

  </div><!-- /main -->
</div><!-- /admin-wrap -->

<script>
// ════════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════════
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwRW2K-GbHfawvZMpxk5ExfyYg5EIhFpUgTy-nHaMjtNR1ZiWn-9BuZpRSWACTEGLqNlA/exec';

const STORES = [
  { key:'AlRoknAlMasry', name:'الركن المصري', color:'#ef4444', folder:'Al Rokn AL masry' },
  { key:'AlFayoumi',     name:'الفيومي',      color:'#f59e0b', folder:'Al Fayoumy'       },
];

// ════════════════════════════════════════════════════════
//  API HELPER
// ════════════════════════════════════════════════════════
async function api(action, data={}, timeout=25000) {
  const clean = {};
  Object.entries(data).forEach(([k,v]) => { if(v!=='' && v!=null) clean[k]=v; });
  const params = new URLSearchParams({ action, ...clean });
  const url = `${APPS_SCRIPT_URL}?${params}`;
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res  = await fetch(url, { redirect:'follow', signal:ctrl.signal });
    clearTimeout(t);
    const text = await res.text();
    return JSON.parse(text);
  } catch(e) {
    clearTimeout(t);
    throw new Error(e.name==='AbortError' ? 'انتهت مهلة الاتصال' : e.message);
  }
}

// ════════════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════════════
function switchPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  const page = document.getElementById('page-' + id);
  if (page) page.classList.add('active');

  const clickedNav = [...document.querySelectorAll('.nav-item')]
    .find(n => n.getAttribute('onclick')?.includes(id));
  if (clickedNav) clickedNav.classList.add('active');

  const titles = { overview:'📊 نظرة عامة', 'store-AlRoknAlMasry':'🔴 الركن المصري', 'store-AlFayoumi':'🟡 الفيومي' };
  document.getElementById('topbarTitle').textContent = titles[id] || id;

  if (id.startsWith('store-')) {
    const storeKey = id.replace('store-','');
    renderStorePage(storeKey);
  }
}

// ════════════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════════════
function toast(msg, type='info') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success:'fa-check-circle', error:'fa-times-circle', info:'fa-info-circle' };
  el.innerHTML = `<i class="fas ${icons[type]||'fa-info-circle'}"></i> ${msg}`;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ════════════════════════════════════════════════════════
//  OVERVIEW — load stats
// ════════════════════════════════════════════════════════
async function loadOverview() {
  const sb = document.getElementById('storeBars');
  sb.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';
  try {
    const res = await api('getAdminStats', {}, 20000);
    if (!res || !res.success) throw new Error(res?.message || 'فشل الاستجابة');
    const s = res.stats;
    document.getElementById('st-total').textContent     = s.total     ?? 0;
    document.getElementById('st-new').textContent       = s.new       ?? 0;
    document.getElementById('st-preparing').textContent = s.preparing ?? 0;
    document.getElementById('st-delivered').textContent = s.delivered ?? 0;
    document.getElementById('st-cancelled').textContent = s.cancelled ?? 0;
    const max    = Math.max(1, ...Object.values(s.perStore || {}));
    const colors = { AlRoknAlMasry:'#ef4444', AlFayoumi:'#f59e0b' };
    const names  = { AlRoknAlMasry:'الركن المصري', AlFayoumi:'الفيومي' };
    sb.innerHTML = Object.entries(s.perStore || {}).map(([k,v]) =>
        `<div class="store-bar-row">
           <div class="store-bar-label">${names[k]||k}</div>
           <div class="store-bar-track"><div class="store-bar-fill" style="width:${Math.round(v/max*100)}%;background:${colors[k]||'#18bfef'}"></div></div>
           <div class="store-bar-count">${v}</div>
         </div>`).join('')
      || '<div class="empty-state">لا توجد طلبات</div>';
  } catch(e) {
    sb.innerHTML = `<div class="empty-state" style="color:#ff8060">
      ❌ ${e.message}<br>
      <small style="opacity:.6">اضغط "تحديث" للمحاولة مجدداً</small>
    </div>`;
  }
}

// ════════════════════════════════════════════════════════
//  STORE PAGE
// ════════════════════════════════════════════════════════
let _storeOrdersCache = {};

async function renderStorePage(storeKey) {
  const store = STORES.find(s => s.key === storeKey);
  if (!store) return;
  const container = document.getElementById('page-store-' + storeKey);

  container.innerHTML = `
    <div style="max-width:1100px">

      <!-- Window Control -->
      <div class="section-head" style="margin-bottom:.8rem">
        <div class="section-title" style="color:${store.color}">
          <i class="fas fa-clock"></i> نافذة استقبال الطلبات — ${store.name}
        </div>
        <div id="winStatus-${storeKey}" class="window-status closed">
          <i class="fas fa-circle" style="font-size:.5rem"></i> جاري التحقق...
        </div>
      </div>
      <div class="window-panel">
        <div class="window-row">
          <div class="window-field">
            <label><i class="fas fa-play-circle" style="color:#28c864"></i> وقت الفتح</label>
            <input type="datetime-local" id="win-start-${storeKey}">
          </div>
          <div class="window-field">
            <label><i class="fas fa-stop-circle" style="color:#ff6060"></i> وقت الإغلاق</label>
            <input type="datetime-local" id="win-end-${storeKey}">
          </div>
          <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end">
            <button class="btn btn-primary" onclick="saveWindow('${storeKey}')">
              <i class="fas fa-save"></i> حفظ النافذة
            </button>
            <button class="btn btn-outline" onclick="loadStoreWindow('${storeKey}')">
              <i class="fas fa-sync"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Batch Control -->
      <div class="section-head" style="margin-bottom:.8rem;margin-top:1.5rem">
        <div class="section-title"><i class="fas fa-layer-group"></i> الدورة الحالية (Batch)</div>

  loadStoreOrders(storeKey);

}

// ── Batch functions ──
async function loadBatchStatus(storeKey) {
  try {
    const res = await api('getActiveBatch', { store: storeKey });
    const statusEl = document.getElementById('batchStatus-' + storeKey);
    const idEl     = document.getElementById('batchId-' + storeKey);
    if (res.success && res.batchId) {
      if (idEl) idEl.textContent = res.batchId;
      if (statusEl) {
        statusEl.innerHTML = res.isActive
          ? '<span style="color:#28c864"><i class="fas fa-circle" style="font-size:.5rem"></i> نشطة</span>'
          : '<span style="color:#ff6060"><i class="fas fa-circle" style="font-size:.5rem"></i> مغلقة</span>';
      }
    } else {
      if (idEl) idEl.textContent = 'لا توجد دورة — اضغط "بدء دورة جديدة"';
      if (statusEl) statusEl.textContent = 'غير موجودة';
    }
  } catch(e) { console.warn('loadBatchStatus', e.message); }
}

async function startNewBatch(storeKey) {
  if (!confirm('بدء دورة جديدة؟\n\nسيتم إنشاء BatchID جديد. الطلبات الجديدة ستُضاف لهذه الدورة.')) return;
  try {
    const res = await api('startNewBatch', { store: storeKey });
    if (res.success) {
      const msg = res.autoClosedOrders > 0 ? ' — ' + res.autoClosedOrders + ' طلب تحول لـ جاري التحضير' : '';
      toast('✓ دورة جديدة بدأت' + msg, 'success');
      loadBatchStatus(storeKey); loadStoreOrders(storeKey);
    }
    else toast('خطأ: ' + res.message, 'error');
  } catch(e) { toast('تعذر: ' + e.message, 'error'); }
}

async function reactivateBatch(storeKey) {
  if (!confirm('تمديد الدورة الحالية؟\n\nسيتم إعادة تفعيل نفس الـ BatchID بدون تغييره.')) return;
  try {
    const res = await api('reactivateBatch', { store: storeKey });
    if (res.success) { toast('✓ تم تفعيل الدورة: ' + res.batchId, 'success'); loadBatchStatus(storeKey); }
    else toast('خطأ: ' + res.message, 'error');
  } catch(e) { toast('تعذر: ' + e.message, 'error'); }
}

async function closeBatchAdmin(storeKey) {
  if (!confirm('إغلاق الدورة الحالية؟\n\nجميع الطلبات "جديدة" ستتحول إلى "جاري التحضير".')) return;
  try {
    const res = await api('closeBatch', { store: storeKey });
    if (res.success) {
      toast(`✓ تم الإغلاق — ${res.ordersUpdated} طلب تحول لـ "جاري التحضير"`, 'success');
      loadBatchStatus(storeKey);
      loadStoreOrders(storeKey);
    } else toast('خطأ: ' + res.message, 'error');
  } catch(e) { toast('تعذر: ' + e.message, 'error'); }
}

// ── Load order window for store ──
async function loadStoreWindow(storeKey) {
  try {
    const res = await api('getStoreOrderWindow', { store: storeKey });
    const statusEl = document.getElementById('winStatus-' + storeKey);
    if (res.success && res.start) {
      const startInput = document.getElementById('win-start-' + storeKey);
      const endInput   = document.getElementById('win-end-'   + storeKey);
      if (startInput) startInput.value = _toDatetimeLocal(res.start);
      if (endInput)   endInput.value   = _toDatetimeLocal(res.end);
      // Show status
      const now = new Date(), start = new Date(res.start), end = new Date(res.end);
      if (statusEl) {
        if (now < start)      { statusEl.className='window-status before'; statusEl.innerHTML='<i class="fas fa-circle" style="font-size:.5rem"></i> لم تُفتح بعد'; }
        else if (now <= end)  { statusEl.className='window-status open';   statusEl.innerHTML='<i class="fas fa-circle" style="font-size:.5rem"></i> مفتوحة الآن'; }
        else                  { statusEl.className='window-status closed'; statusEl.innerHTML='<i class="fas fa-circle" style="font-size:.5rem"></i> مغلقة'; }
      }
    } else {
      if (statusEl) { statusEl.className='window-status closed'; statusEl.innerHTML='<i class="fas fa-circle" style="font-size:.5rem"></i> غير محددة'; }
    }
  } catch(e) { console.warn('loadStoreWindow', e.message); }
}

// ── Save order window for store ──
async function saveWindow(storeKey) {
  const start = document.getElementById('win-start-' + storeKey)?.value;
  const end   = document.getElementById('win-end-'   + storeKey)?.value;
  if (!start || !end) { toast('يرجى تحديد وقت الفتح والإغلاق', 'error'); return; }
  if (new Date(end) <= new Date(start)) { toast('وقت الإغلاق يجب أن يكون بعد وقت الفتح', 'error'); return; }
  try {
    const res = await api('setStoreOrderWindow', { store: storeKey, start: start.replace('T',' ') + ':00', end: end.replace('T',' ') + ':00' });
    if (res.success) { toast('تم حفظ النافذة بنجاح ✓', 'success'); loadStoreWindow(storeKey); }
    else toast('خطأ: ' + res.message, 'error');
  } catch(e) { toast('تعذر الحفظ: ' + e.message, 'error'); }
}

// ── Load orders table for store ──
async function loadStoreOrders(storeKey) {
  const container = document.getElementById('table-' + storeKey);
  if (!container) return;
  container.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><br>جاري التحميل...</div>';
  try {
    const res = await api('getStoreOrders', { sheet: storeKey });
    if (!res.success) throw new Error(res.message);
    _storeOrdersCache[storeKey] = res.orders || [];
    renderOrdersTable(storeKey, res.orders || []);
  } catch(e) {
    container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>تعذر التحميل: ${e.message}</div>`;
  }
}

function renderOrdersTable(storeKey, orders) {
  const container = document.getElementById('table-' + storeKey);
  if (!container) return;
  if (!orders.length) {
    container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><br>لا توجد طلبات</div>';
    return;
  }
  // Sort newest first
  orders.sort((a,b) => (b.date||'') > (a.date||'') ? 1 : -1);
  container.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>رقم الطلب</th>
          <th>الاسم</th>
          <th>الهاتف</th>
          <th>الطلب</th>
          <th>الحالة</th>
          <th>BatchID</th>
          <th>التاريخ</th>
          <th>آخر تحديث</th>
          <th>إجراء</th>
        </tr>
      </thead>
      <tbody>
        ${orders.map(o => `
          <tr>
            <td class="td-id">${o.id||'—'}</td>
            <td>${o.name||'—'}</td>
            <td style="font-family:monospace;font-size:.8rem">${o.phone||'—'}</td>
            <td class="td-items" title="${o.items||''}">${o.items||'—'}</td>
            <td><span class="badge badge-${o.status||'New'}">${_statusAr(o.status)}</span></td>
            <td style="font-family:monospace;font-size:.7rem;color:rgba(255,255,255,.35);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${o.batchId||''}">${o.batchId ? o.batchId.replace('BATCH-','').split('-').slice(-1)[0] : '—'}</td>
            <td class="td-date">${_fmtDate(o.date)}</td>
            <td class="td-date">${_fmtDate(o.updated)}</td>
            <td>
              <select class="status-select" onchange="updateSingleStatus('${o.id}','${storeKey}',this)">
                <option value="New"       ${o.status==='New'       ?'selected':''}>جديد</option>
                <option value="Preparing" ${o.status==='Preparing' ?'selected':''}>جاري التحضير</option>
                <option value="Delivered" ${o.status==='Delivered' ?'selected':''}>تم التوصيل</option>
                <option value="Cancelled" ${o.status==='Cancelled' ?'selected':''}>ملغي</option>
              </select>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

// ── Update single order status ──
async function updateSingleStatus(orderId, storeKey, selectEl) {
  const newStatus = selectEl.value;
  const orig = selectEl.dataset.orig || selectEl.value;
  selectEl.disabled = true;
  try {
    const res = await api('adminUpdateOrderStatus', { orderId, status: newStatus, sheet: storeKey });
    if (res.success) {
      toast(`تم تحديث الحالة إلى: ${_statusAr(newStatus)}`, 'success');
      selectEl.dataset.orig = newStatus;
    } else {
      toast('خطأ: ' + res.message, 'error');
      selectEl.value = orig;
    }
  } catch(e) {
    toast('تعذر التحديث: ' + e.message, 'error');
    selectEl.value = orig;
  } finally { selectEl.disabled = false; }
}

// ── Bulk status change ──
async function bulkStatus(storeKey, fromStatus, toStatus) {
  const fromAr = _statusAr(fromStatus), toAr = _statusAr(toStatus);
  if (!confirm(`تحويل جميع الطلبات "${fromAr}" إلى "${toAr}"؟\n\nهذا الإجراء يؤثر على جميع الطلبات المؤهلة.`)) return;
  try {
    const res = await api('bulkUpdateStatus', { sheet: storeKey, fromStatus, toStatus });
    if (res.success) {
      toast(`تم تحويل ${res.updated} طلب من "${fromAr}" إلى "${toAr}" ✓`, 'success');
      loadStoreOrders(storeKey);
    } else toast('خطأ: ' + res.message, 'error');
  } catch(e) { toast('تعذر التنفيذ: ' + e.message, 'error'); }
}

// ════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════
function _statusAr(s) {
  return { New:'جديد', Preparing:'جاري التحضير', Delivered:'تم التوصيل', Cancelled:'ملغي' }[s] || s;
}
function _fmtDate(d) {
  if (!d) return '—';
  return String(d).substring(0, 16);
}
function _toDatetimeLocal(str) {
  if (!str) return '';
  try {
    const d = new Date(String(str).trim());
    if (isNaN(d.getTime())) return String(str).replace(' ','T').substring(0,16);
    // Use LOCAL time (not UTC) so 7pm shows as 7pm in the browser
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch(_) { return String(str).replace(' ','T').substring(0,16); }
}

// ════════════════════════════════════════════════════════
//  REFRESH ALL
// ════════════════════════════════════════════════════════
async function refreshAll() {
  const btn = document.querySelector('.btn-refresh');
  btn.innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> جاري التحديث...';
  await loadOverview();
  // Refresh active store if on store page
  const activePage = document.querySelector('.page.active');
  if (activePage && activePage.id.startsWith('page-store-')) {
    const storeKey = activePage.id.replace('page-store-','');
    loadStoreOrders(storeKey);
    loadStoreWindow(storeKey);
  }
  document.getElementById('lastRefresh').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar');
  btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث';
}

//  BOOT
// ════════════════════════════════════════════════════════
function hideOverlay() {
  document.getElementById('loadingOverlay').style.display = 'none';
}
// Safety: always hide overlay after 6s max — never stay stuck
setTimeout(hideOverlay, 6000);

(async function init() {
  try {
    await loadOverview();
    document.getElementById('lastRefresh').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar');
  } catch(e) {
    console.warn('[Admin] init error:', e.message);
  } finally {
    hideOverlay();
  }
})();
// ── Extend Batch Modal ────────────────────────────────────
let _extendStore   = null;
let _extendBatches = [];

async function openExtendModal(storeKey) {
  _extendStore = storeKey;
  // Default new end = now + 2 hours
  const d = new Date(Date.now() + 2 * 3600000);
  const pad = n => String(n).padStart(2,'0');
  const def = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  document.getElementById('extendNewEnd').value = def;
  document.getElementById('extendBatchInfo').style.display = 'none';
  document.getElementById('extendModal').style.display = 'flex';

  // Load previous batches into dropdown
  const sel = document.getElementById('extendBatchSelect');
  sel.innerHTML = '<option value="">⏳ جاري تحميل الدورات...</option>';
  try {
    const res = await api('getPreviousBatches', { store: storeKey });
    _extendBatches = res.batches || [];
    if (!_extendBatches.length) {
      sel.innerHTML = '<option value="">لا توجد دورات سابقة</option>';
      return;
    }
    sel.innerHTML = '<option value="">— اختر دورة —</option>' +
      _extendBatches.map(b => {
        const label = b.batchId.replace('BATCH-','').replace(storeKey+'-','').slice(-6);
        const active = b.isActive ? ' ★ نشطة' : '';
        const info = `[${b.total} طلب | ${(b.firstOrder||'').substring(0,10)}]`;
        return `<option value="${b.batchId}">${label}${active} ${info}</option>`;
      }).join('');
    // Auto-select the active batch
    const activeBatch = _extendBatches.find(b => b.isActive);
    if (activeBatch) { sel.value = activeBatch.batchId; onExtendBatchChange(); }
  } catch(e) {
    sel.innerHTML = '<option value="">تعذر التحميل</option>';
  }
}

function onExtendBatchChange() {
  const batchId  = document.getElementById('extendBatchSelect').value;
  const infoEl   = document.getElementById('extendBatchInfo');
  if (!batchId) { infoEl.style.display = 'none'; return; }
  const batch = _extendBatches.find(b => b.batchId === batchId);
  if (!batch) return;
  infoEl.style.display = '';
  infoEl.innerHTML = `
    <div style="color:rgba(255,255,255,.5);margin-bottom:.3rem">تفاصيل الدورة المختارة:</div>
    <div>🆔 <span style="font-family:monospace;color:#18bfef;font-size:.75rem">${batch.batchId}</span></div>
    <div>📅 أول طلب: <b style="color:#fff">${(batch.firstOrder||'—').substring(0,16)}</b></div>
    <div>📅 آخر طلب: <b style="color:#fff">${(batch.lastOrder||'—').substring(0,16)}</b></div>
    <div>📦 إجمالي الطلبات: <b style="color:#fff">${batch.total}</b>
      &nbsp;|&nbsp; جديد: <span style="color:#18bfef">${batch.new}</span>
      &nbsp;|&nbsp; تحضير: <span style="color:#ffa500">${batch.preparing}</span>
      &nbsp;|&nbsp; تسليم: <span style="color:#28c864">${batch.delivered}</span>
    </div>
    ${batch.isActive ? '<div style="color:#28c864;margin-top:.2rem">✓ الدورة الحالية النشطة</div>' : '<div style="color:#ffa500;margin-top:.2rem">⚠ دورة سابقة — سيتم إعادة تفعيلها</div>'}`;
}

function closeExtendModal() {
  document.getElementById('extendModal').style.display = 'none';
  _extendStore   = null;
  _extendBatches = [];
}

async function confirmExtend() {
  const newEndRaw = document.getElementById('extendNewEnd').value;
  const batchId   = document.getElementById('extendBatchSelect').value;
  if (!newEndRaw) { alert('يرجى تحديد وقت التمديد'); return; }
  if (!batchId)   { alert('يرجى اختيار الدورة أولاً'); return; }
  const newEnd = newEndRaw.replace('T',' ') + ':00';
  const btn = document.getElementById('extendConfirmBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التمديد...';
  try {
    const res = await api('extendBatch', { store: _extendStore, newEnd, batchId });
    if (res.success) {
      closeExtendModal();
      const rev = res.revertedOrders > 0 ? ` — ${res.revertedOrders} طلب رجع لـ "جديد"` : '';
      toast('✓ تم التمديد حتى ' + newEnd + rev, 'success');
      loadStoreWindow(_extendStore);
      loadBatchStatus(_extendStore);
      loadStoreOrders(_extendStore);
    } else { toast('خطأ: ' + res.message, 'error'); }
  } catch(e) { toast('تعذر: ' + e.message, 'error'); }
  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-check"></i> تأكيد التمديد';
}
</script>
