<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomiCart</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f7f7fb;
      margin:0;
      padding:0;
    }

    header{
      background:#2e5cff;
      color:#fff;
      padding:18px 20px;
      text-align:center;
    }

    .container{
      max-width:800px;
      margin:30px auto;
      background:#fff;
      border-radius:12px;
      padding:25px;
      box-shadow:0 10px 25px rgba(0,0,0,.08);
    }

    .section{
      margin-bottom:25px;
    }

    button{
      background:#2e5cff;
      color:white;
      border:none;
      border-radius:8px;
      padding:10px 16px;
      cursor:pointer;
    }

    button:hover{
      opacity:.9;
    }

    input, select, textarea {
      width:100%;
      padding:10px;
      border-radius:8px;
      border:1px solid #ddd;
      margin-top:6px;
    }

    .note{
      font-size:13px;
      color:#666;
    }
  </style>
</head>

<body>

<header>
  <h1>HomiCart</h1>
  <p>Your home orders — all in one place</p>
</header>

<div class="container">

  <div class="section">
    <h2>🌟 هتعملي ايه؟</h2>
    <button onclick="choose('new')">أعمل أوردر جديد</button>
    <button onclick="choose('edit')">أعدل على آخر أوردر</button>
  </div>

  <div id="form-area" class="section"></div>

  <p class="note">
    — النسخة دي تجريبية، وهنطوّرها سوا واحدة واحدة 💙
  </p>

</div>

<script>
  function choose(type){
    const box = document.getElementById("form-area");

    if(type === "new"){
      box.innerHTML = `
        <h3>🛒 أوردر جديد</h3>
        <label>رقم الموبايل</label>
        <input placeholder="اكتبي رقمك">

        <label>تفاصيل الأوردر</label>
        <textarea placeholder="اكتبي طلباتك هنا"></textarea>

        <button>إرسال</button>
      `;
    }

    if(type === "edit"){
      box.innerHTML = `
        <h3>✏️ تعديل آخر أوردر</h3>
        <label>رقم الموبايل</label>
        <input placeholder="اكتبي رقمك — عشان نجيب آخر أوردر ليكي">

        <button>عرض الأوردر</button>
      `;
    }
  }
</script>

</body>
</html>
